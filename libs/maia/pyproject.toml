[project]
name = "blunder-maia"
version = "0.1.0"
dependencies = [
    "blunder-shared",
    "maia3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blunder"]

[tool.uv.sources]
blunder-shared = { workspace = true }
maia3 = { git = "https://github.com/daniel-monroe/maia3", branch = "rmponder" }
