[project]
name = "blunder-synthetic"
version = "0.1.0"
dependencies = [
    "blunder-maia",
    "blunder-shared",
    "blunder-stockfish",
]

[project.scripts]
generate = "blunder.synthetic:generate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blunder"]

[tool.uv.sources]
blunder-shared = { workspace = true }
blunder-maia = { workspace = true }
blunder-stockfish = { workspace = true }
